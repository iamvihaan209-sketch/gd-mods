name: Build GDH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "gdh-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [MacOS]
    name: ${{ matrix.target }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS FFmpeg libs
        run: |
          mkdir -p gdh/libs/ffmpeg/mac
          # If you have a direct link to a built mac ffmpeg archive (.zip/.7z), download it here:
          # curl -L --retry 3 -o ffmpeg-mac.zip <your-mac-ffmpeg-url>
          # unzip ffmpeg-mac.zip -d gdh/libs/ffmpeg/mac/
          
          # Alternatively, if you need to place/verify the path:
          ls -R gdh/libs/ffmpeg

      - name: Build GDH
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "v6.0.0-alpha.3"
          bindings: "geode-sdk/bindings"
          bindings-ref: "main"
          path: gdh
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package GDH
    runs-on: macos-15-intel
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Upload merged geode
        uses: actions/upload-artifact@v4
        with:
          name: gdh-geode-macos
          path: ${{ steps.build.outputs.build-output }}/*.geode
