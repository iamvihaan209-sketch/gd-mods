name: Build GDH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "gdh-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [MacOS]
    name: ${{ matrix.target }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg via Homebrew
        run: |
          brew install ffmpeg
          mkdir -p gdh/libs/ffmpeg/mac
          ln -s $(brew --prefix ffmpeg)/include gdh/libs/ffmpeg/include || true
          ln -s $(brew --prefix ffmpeg)/lib gdh/libs/ffmpeg/mac/lib || true

      - name: Build GDH
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "v6.0.0-alpha.3"
          bindings: "geode-sdk/bindings"
          bindings-ref: "main"
          path: gdh
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package GDH
    runs-on: macos-26-intel
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Upload merged geode
        uses: actions/upload-artifact@v4
        with:
          name: gdh-geode-macos
          path: ${{ steps.build.outputs.build-output }}/*.geode
