name: Build GDH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "gdh-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [MacOS]
    name: ${{ matrix.target }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create FFmpeg Mac Stub Library
        run: |
          mkdir -p gdh/libs/ffmpeg/mac
          # Create a valid empty static library archive so Ninja/CMake is satisfied
          echo "" | clang -x c -c - -o dummy.o
          ar rcs gdh/libs/ffmpeg/mac/libffmpeg_all.a dummy.o
          rm dummy.o

      - name: Build GDH
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "v6.0.0-alpha.3"
          bindings: "geode-sdk/bindings"
          bindings-ref: "main"
          path: gdh
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package GDH
    runs-on: macos-15
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Upload merged geode
        uses: actions/upload-artifact@v4
        with:
          name: gdh-geode-macos
          path: ${{ steps.build.outputs.build-output }}/*.geode
