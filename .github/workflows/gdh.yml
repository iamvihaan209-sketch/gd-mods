name: Build GDH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "gdh-v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [MacOS]
    name: ${{ matrix.target }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg via Homebrew and Setup Libs
        run: |
          brew install ffmpeg
          mkdir -p gdh/libs/ffmpeg/mac
          
          # Link or copy Homebrew ffmpeg static libraries/headers into gdh expected paths
          BREW_PREFIX="$(brew --prefix ffmpeg)"
          
          # If individual .a files exist, copy them to satisfy the build system, 
          # or create a symlink pointing to Homebrew's lib directory
          ln -s "$BREW_PREFIX/include" gdh/libs/ffmpeg/include || true
          
          # Create a symbolic link or copy the lib files into gdh/libs/ffmpeg/mac/
          # (If the build expects a combined static lib, you can map the .a files directly)
          for file in "$BREW_PREFIX/lib"/*.a; do
            if [ -f "$file" ]; then
              cp "$file" gdh/libs/ffmpeg/mac/
            fi
          done
          
          # Fallback: if libffmpeg_all.a is strictly required as a single file name, 
          # you can alias or copy one of the archives, or check your local setup.
          ls -la gdh/libs/ffmpeg/mac/

      - name: Build GDH
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "v6.0.0-alpha.3"
          bindings: "geode-sdk/bindings"
          bindings-ref: "main"
          path: gdh
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package GDH
    runs-on: macos-15
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Upload merged geode
        uses: actions/upload-artifact@v4
        with:
          name: gdh-geode-macos
          path: ${{ steps.build.outputs.build-output }}/*.geode
